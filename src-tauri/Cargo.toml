[package]
name = "texlooper"
version = "0.3.4-alpha"
description = "texLooper — document studio with Rust runtime backbone"
authors = ["texLooper"]
edition = "2021"
default-run = "texlooper"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-build", "dep:include_dir"]

[lib]
name = "texlooper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "texlooper"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "texlooper-cli"
path = "src/bin/texlooper_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["devtools"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
include_dir = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
regex = "1"
lopdf = "0.34"
printpdf = "0.7"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = "0.14"
fontdue = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
