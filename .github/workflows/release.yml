# Automated semver from Conventional Commits (AGENTS.md).
# Bumps package.json, package-lock.json, tauri.conf.json, Cargo.toml/lock,
# commits chore(release), and pushes tag v<version>. Does not deploy.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Avoid infinite loop: release commits must not re-trigger a bump.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need a token that can push tags/commits back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Derive and apply version bump
        id: bump
        run: |
          set -euo pipefail
          before="$(node -p "require('./package.json').version")"
          node scripts/release-bump.mjs | tee /tmp/bump.log
          after="$(node -p "require('./package.json').version")"
          if grep -q '^SKIP:' /tmp/bump.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "version=${before}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$before" == "$after" ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "version=${before}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "version=${after}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push release
        if: steps.bump.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            src-tauri/tauri.conf.json \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
