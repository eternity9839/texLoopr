name: Deploy orangepi

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "flake.nix"
      - "flake.lock"
      - "shell.nix"
      - "deploy/orangepi/**"
      - ".github/workflows/deploy-orangepi.yml"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: Force app + API recreate even if deploy stamps unchanged
        type: boolean
        default: false

concurrency:
  group: deploy-orangepi
  cancel-in-progress: true

env:
  TS_CI_TAG: tag:texloopr-ci
  # Attic on QNAP, HTTPS via Orange Pi node Tailscale Serve
  ATTIC_URL: https://orangepi5.tail48a8e.ts.net
  ATTIC_CACHE: homelab
  ATTIC_PUBKEY: homelab:cS6tkTk44xYXzOUUWXptlMntjKbRjb+hzab1L76UK1s=

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Build first without Attic — Pi OOM/offline must not block typecheck/test.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Typecheck, test, and build SPA
        run: bash deploy/orangepi/ci-build.sh

      # Tailnet for Attic + deploy. Stay on v3 (v4 rejected this OAuth client).
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ env.TS_CI_TAG }}

      - name: Wait for orangepi5 peer
        run: |
          set -euo pipefail
          echo "self:"
          tailscale status --self || true
          echo "tags: $(tailscale status --json | jq -r '.Self.Tags // empty | join(",")')"

          # Fail fast when control already marks the Pi offline; then backoff.
          # ~5 minutes total — enough for a reboot, not an overnight OOM storm.
          deadline=$((SECONDS + 300))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            peer="$(tailscale status --json | jq -r '
              .Peer[]?
              | select(.HostName=="orangepi5" or .DNSName=="orangepi5.tail48a8e.ts.net." or (.DNSName|endswith("orangepi5.tail48a8e.ts.net.")))
              | "online=\(.Online) last=\(.LastSeen // "n/a")"
            ' | head -1 || true)"
            echo "peer: ${peer:-not in netmap yet}"

            if [[ "${peer}" == online=false* ]] && (( attempt >= 3 )); then
              echo "error: orangepi5 is Offline in Tailscale (likely host reboot/OOM). Skip burn; retry later." >&2
              tailscale status || true
              exit 1
            fi

            if tailscale ping -c 1 --timeout 3s orangepi5 >/dev/null 2>&1; then
              echo "orangepi5 reachable after ${attempt} attempt(s)"
              tailscale ping -c 3 orangepi5
              exit 0
            fi

            sleep $(( attempt < 5 ? 2 : 5 ))
          done

          echo "error: orangepi5 never answered ping within 5m" >&2
          tailscale status || true
          exit 1

      - name: Enable Attic substituter
        run: |
          set -euo pipefail
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<EOF
          extra-substituters = ${ATTIC_URL}/${ATTIC_CACHE}
          extra-trusted-public-keys = ${ATTIC_PUBKEY}
          EOF

      - name: Attic smoke (tailnet)
        continue-on-error: true
        run: |
          curl -fsS "${ATTIC_URL}/${ATTIC_CACHE}/nix-cache-info" | head -5

      - name: Install attic-client
        continue-on-error: true
        run: nix profile install nixpkgs#attic-client

      # Optional cache warm — never block deploy on Attic auth / path-info issues
      - name: Push devShell to Attic
        continue-on-error: true
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: bash deploy/orangepi/ci-attic-push.sh

      - name: Deploy to Pi (Tailscale SSH)
        env:
          FORCE_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.force_redeploy && '1' || '0' }}
          FORCE_API: ${{ github.event_name == 'workflow_dispatch' && inputs.force_redeploy && '1' || '0' }}
          TEXLOOPER_GIT_COMMIT: ${{ github.sha }}
          TEXLOOPER_GIT_TAG: ${{ github.ref_name }}
        run: bash deploy/orangepi/ci-deploy-remote.sh
