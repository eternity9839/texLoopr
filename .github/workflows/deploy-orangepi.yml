name: Deploy orangepi

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "flake.nix"
      - "flake.lock"
      - "shell.nix"
      - "deploy/orangepi/**"
      - ".github/workflows/deploy-orangepi.yml"
  workflow_dispatch:

concurrency:
  group: deploy-orangepi
  cancel-in-progress: true

env:
  TS_CI_TAG: tag:texloopr-ci
  # Attic on QNAP, HTTPS via Orange Pi node Tailscale Serve
  ATTIC_URL: https://orangepi5.tail48a8e.ts.net
  ATTIC_CACHE: homelab
  ATTIC_PUBKEY: homelab:cS6tkTk44xYXzOUUWXptlMntjKbRjb+hzab1L76UK1s=

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Tailnet first — Attic substituter is only reachable over Tailscale.
      # Stay on v3 (v4 rejected this OAuth client with "invalid key"); ping manually.
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ env.TS_CI_TAG }}

      - name: Wait for orangepi5 peer
        run: |
          set -euo pipefail
          echo "self:"
          tailscale status --self || true
          echo "tags: $(tailscale status --json | jq -r '.Self.Tags // empty | join(",")')"
          for i in $(seq 1 30); do
            if tailscale ping -c 1 --timeout 3s orangepi5 >/dev/null 2>&1; then
              echo "orangepi5 reachable after ${i} attempt(s)"
              tailscale ping -c 3 orangepi5
              exit 0
            fi
            echo "waiting for orangepi5 (${i}/30)…"
            sleep 2
          done
          echo "error: orangepi5 never answered ping" >&2
          tailscale status || true
          exit 1

      - name: Attic smoke (tailnet)
        run: |
          curl -fsS "${ATTIC_URL}/${ATTIC_CACHE}/nix-cache-info" | head -5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            substituters = https://cache.nixos.org ${{ env.ATTIC_URL }}/${{ env.ATTIC_CACHE }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ env.ATTIC_PUBKEY }}

      - name: Install attic-client
        run: nix profile install nixpkgs#attic-client

      - name: Typecheck, test, and build SPA
        run: bash deploy/orangepi/ci-build.sh

      # Optional cache warm — never block deploy on Attic auth / path-info issues
      - name: Push devShell to Attic
        continue-on-error: true
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: bash deploy/orangepi/ci-attic-push.sh

      - name: Deploy to Pi (Tailscale SSH)
        run: bash deploy/orangepi/ci-deploy-remote.sh
