# Cross-platform Tauri desktop builds (Linux, Windows, macOS arm64 + x64).
# - Tag pushes (v*): create/update the GitHub Release and attach bundles.
# - workflow_dispatch: build and upload workflow artifacts only (no release).
# Release workflow tags main → this job runs automatically on v*.
name: Desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which matrix slice to build
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
        default: all

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    needs: test
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            slice: macos
          - id: macos-x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            slice: macos
          - id: linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            slice: linux
          - id: windows
            platform: windows-latest
            args: ""
            rust_targets: ""
            slice: windows

    runs-on: ${{ matrix.platform }}
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == matrix.slice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.slice == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: desktop-${{ matrix.id }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Detect prerelease channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Tauri bundles (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: texLooper v__VERSION__
          releaseBody: |
            Desktop builds for Linux (AppImage / deb / rpm), Windows (msi / nsis), and macOS (dmg).

            Launch on NixOS with `nix run .#texlooper` after a local build — do not install the `.deb` on NixOS.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: texlooper-v[version]-[platform]-[arch][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: texlooper-v[version]-[platform]-[arch]-[bundle]

      - name: Build Tauri bundles (manual / artifacts only)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: texlooper-v[version]-[platform]-[arch]-[bundle]
