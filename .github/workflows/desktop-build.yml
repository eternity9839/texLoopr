# Cross-platform Tauri desktop builds (Linux, Windows, macOS arm64 + x64).
# - Tag pushes (v*): create/update the GitHub Release and attach bundles.
# - workflow_dispatch: build and upload workflow artifacts only (no release).
# One workflow, separate jobs per gate and per OS (fail-fast isolated).
name: Desktop build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platform jobs to run
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
        default: all

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test-model:
    name: test-model
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Unit tests (model)
        run: npm test -- src/model

  test-app:
    name: test-app
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Unit tests (app / UI / storage)
        run: npm test -- src/features src/ui src/state src/runtimeConfig.test.ts

  build-linux:
    name: linux
    needs: [typecheck, test-model, test-app]
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'linux'
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      id: linux
      platform: ubuntu-22.04
      slice: linux
      args: ""
      rust_targets: ""

  build-windows:
    name: windows
    needs: [typecheck, test-model, test-app]
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'windows'
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      id: windows
      platform: windows-latest
      slice: windows
      args: ""
      rust_targets: ""

  build-macos-arm:
    name: macos-arm
    needs: [typecheck, test-model, test-app]
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'macos'
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      id: macos-arm
      platform: macos-latest
      slice: macos
      args: "--target aarch64-apple-darwin"
      rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"

  build-macos-x64:
    name: macos-x64
    needs: [typecheck, test-model, test-app]
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'macos'
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      id: macos-x64
      platform: macos-latest
      slice: macos
      args: "--target x86_64-apple-darwin"
      rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
